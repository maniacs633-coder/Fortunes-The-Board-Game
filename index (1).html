function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

async function gainCard(p){const c=draw();if(!c)return null;const s=p.hand.indexOf(null);if(s>=0){p.hand[s]=c;return c}
const list=[...p.hand.map((x,k)=>({c:x,label:"Slot "+(k+1)})),{c,label:"New card"}];
const j=await cardPick(p,"Hand full","Your hand is full. Choose one card to discard.",list);
if(j===list.length-1)disc.push(c);else{disc.push(p.hand[j]);p.hand[j]=c}return c}

/* ---------- Wild Cards: AI helpers ---------- */
function simLand(p,n,d=0,sh=false){const a=G.T[n]&&G.T[n][2];if(!a)return{pos:n};
if((a.only&&!a.only.includes(p.ch))||(a.not&&a.not.includes(p.ch)))return{pos:n};
if(a.secret)return p.key?{pos:n,win:1}:{pos:n};
if(a.needRec&&p.rec!==a.needRec)return{pos:n};
if(sh===true&&isBad(a,n))return{pos:n};
if(a.win)return{pos:n,win:1};
if(a.lose)return{pos:n,out:1};
if(a.go!==undefined){if(a.skip)return{pos:a.go,skip:a.skip};return(d<6&&!a.nc)?simLand(p,a.go,d+1,sh):{pos:a.go}}
if(a.back||a.fwd){const t=Math.max(0,n+(a.fwd||0)-(a.back||0));return d<6?simLand(p,t,d+1,sh):{pos:t}}
if(a.skip)return{pos:n,skip:a.skip};
return{pos:n}}
const score=r=>r.win?G.end*2:r.out?-G.end*.3:r.pos-(r.skip||0)*3.5;
function landScore(p,n,sh,from){if(n>G.end)return from;const t=TR[n];
const tv=t&&(!sh||t.card.id==="backfire");
if(tv){const id=t.card.id;
if(id==="backfire")return Math.max(0,n-2);
if(id==="rewind")return Math.max(0,n-3);if(id==="start")return 0;if(id==="spin")return Math.max(0,n-3.5);
if(id==="mix"){const o=P.filter(q=>q!==p&&!q.out&&typeof q.pos==="number").map(q=>q.pos);const lp=o.length?Math.min(...o):n;return lp<n?lp:n}}
let s=tv?n:score(simLand(p,n,0,sh));
if(tv)s-=({skip:3.5,heavy:1.75,drain:1.5,tax:1,quick:2})[t.card.id]||0;return s}
function evRoll(p,fn=k=>k,sh=false,pos=numPos(p)){let s=0;for(let k=1;k<=6;k++)s+=landScore(p,pos+fn(k),sh,pos);return s/6}
const trapLoss=(c,t)=>({backfire:2,quick:2.5,skip:3.5,rewind:3,start:t,spin:3.5,drain:1.5,heavy:1.75,tax:1})[c.id]??Math.max(0,t-Math.min(...P.filter(x=>!x.out&&typeof x.pos==="number").map(x=>x.pos)));
function bestTrap(p,c){let best=null;
for(const t of validTiles()){let g=0;
P.forEach(q=>{if(q.out||typeof q.pos!=="number")return;const d=t-q.pos;if(d<1||d>6)return;const w=trapLoss(c,t)/6;g+=q===p?-w*1.2:w*(1+q.pos/G.end)});
if(!best||g>best.g)best={tile:t,g}}return best}
function planEasy(p){if(Math.random()>.4)return null;const o=[];
p.hand.forEach((c,i)=>{if(c&&!playable(p,c))o.push({slot:i,c})});if(!o.length)return null;
const x=o[Math.floor(Math.random()*o.length)];if(x.c.k==="t"){const v=validTiles();x.tile=v[Math.floor(Math.random()*v.length)]}return x}
function planHard(p){const base=evRoll(p),o=[],others=P.filter(q=>q!==p&&!q.out);
p.hand.forEach((c,i)=>{if(!c||playable(p,c))return;
if(c.k==="t"){const b=bestTrap(p,c);if(b&&b.g>.25)o.push({slot:i,c,tile:b.tile,g:b.g});return}
let g=0;
switch(c.id){
case"power":g=evRoll(p,k=>k+2)-base;break;
case"dice":{let s=0;for(let m=1;m<=6;m++)s+=(2*m-1)/36*landScore(p,numPos(p)+m,false,numPos(p));g=s-base;break}
case"reroll":{let s=0;for(let v=1;v<=6;v++)s+=Math.max(landScore(p,numPos(p)+v,false,numPos(p)),base)/6;g=s-base;break}
case"steady":g=Math.max(...[1,2,3].map(k=>landScore(p,numPos(p)+k,false,numPos(p))))-base;break;
case"swap":g=Math.max(...others.map(q=>evRoll(p,k=>k,false,numPos(q))))-base;break;
case"thief":g=1.2;break;
case"sweep":g=evRoll(p,k=>k,"trap")-base;break;
case"draw":g=1.1;break;
case"shield":g=evRoll(p,k=>k,true)-base;break;
case"double":g=2.6;break;
case"magnet":g=1.4;break;
case"ghost":g=evRoll(p,k=>k,"trap")-base-.2;break;
case"detour":g=.7;break}
o.push({slot:i,c,g})});
o.sort((a,b)=>b.g-a.g);return o[0]&&o[0].g>.6||(o[0]&&o[0].c.k==="t")?o[0]:null}

async function playBoost(p,i){const c=p.hand[i];p.hand[i]=null;disc.push(c);p.acted=true;const m=p.mod;
await announce(c.ic,p.ch+" plays "+c.name,c.desc,["OK"]);
const others=P.filter(q=>q!==p&&!q.out);
switch(c.id){
case"power":m.bonus=2;break;
case"dice":m.dice=1;break;
case"reroll":m.reroll=1;break;
case"steady":m.steady=1;break;
case"shield":p.shield=true;break;
case"double":p.extra=true;break;
case"magnet":m.magnet=1;break;

case"swap":{const j=await pick("🔀","Swap Places","Choose who to swap spots with:",others.map(q=>q.em+" "+q.ch+" ("+(q.pos||"Start")+")"),others.map(q=>numPos(q)-numPos(p)));
const q=others[j],pa=p.pos,pb=q.pos;await Promise.all([warp(p,pb),warp(q,pa)]);break}

const j=await pick("🧤","Card Thief","Choose who to steal from:",v.map(q=>q.em+" "+q.ch+" ("+nCards(q)+" cards)"),v.map(q=>nCards(q)*2+numPos(q)/G.end));
const q=v[j],ks=q.hand.map((x,k)=>x?k:-1).filter(k=>k>=0),k=ks[Math.floor(Math.random()*ks.length)],card=q.hand[k];
q.hand[k]=null;p.hand[p.hand.indexOf(null)]=card;
await announce("🧤","Card stolen",p.ch+" took a card from "+q.ch+(!p.cpu&&!MULTI()?": <b>"+card.name+"</b>.":"."));break}
case"sweep":{const ts=Object.keys(TR).map(Number);
const j=await pick("🧹","Trap Sweep","Choose a trap to remove:",ts.map(n=>"Tile "+n+" ("+TR[n].owner.ch+"’s)"),ts.map(n=>TR[n].owner===p?-1:(n-numPos(p)>=1&&n-numPos(p)<=6?3:.5)));
const n=ts[j],t=TR[n];removeTrap(n);await announce("🧹","Trap swept!","It was a "+t.card.name+" set by "+t.owner.ch+". Now it’s gone.");break}
case"draw":{await gainCard(p);await gainCard(p);await announce("🃏","Cards drawn",p.ch+" drew up to two cards.");break}}
upd();renderHand()}
async function placeTrapAt(p,i,n){const c=p.hand[i];p.hand[i]=null;p.acted=true;putTrap(p,c,n);log(`${p.em} ${p.ch} set a trap on tile ${n}`);upd();renderHand();if(!p.cpu)await announce("⚠️","Trap set on tile "+n,"A face-down trap now waits on tile "+n+". Everyone can see the “?”, but only you know what it is.")}
async function useCard(i){const p=P[cur];if(!p||p.cpu||!p.pre||p.acted)return;const c=p.hand[i];if(!c)return;
const why=playable(p,c);if(why){await announce("🚫","Can’t use that",why);return}
$("#roll").disabled=true;
if(c.k==="b")await playBoost(p,i);
else{const n=await chooseTile(validTiles(),"Tap a tile to place your trap face down");if(n!=null)await placeTrapAt(p,i,n)}

async function cpuCards(p){const plan=dif(p)==="hard"?planHard(p):planEasy(p);if(!plan)return;
if(plan.c.k==="t"){await announce("⚠️",p.ch+" sets a trap","A face-down trap was placed on tile "+plan.tile+". Watch your step!");await placeTrapAt(p,plan.slot,plan.tile)}
else await playBoost(p,plan.slot)}

/* ---------- Wild Cards: traps and pickups ---------- */
async function fireTrap(p,n){const t=TR[n],c=t.card;
if(p.shield&&c.id!=="backfire"){await announce(n,"A trap! …blocked","✨ Your Shield blocks the "+c.name+" set by "+t.owner.em+" "+t.owner.ch+".");removeTrap(n);return"blocked"}
await announce(n,"It’s a trap!",t.owner.em+" "+t.owner.ch+" set a <b>"+c.name+"</b>.<br>"+c.desc+(c.id==="backfire"&&(p.shield||p.ghost)?"<br><em>It cuts right through your protection!</em>":""),["Uh oh"]);
removeTrap(n);
switch(c.id){
case"skip":p.skip=(p.skip||0)+1;upd();return;
case"heavy":p.heavy=true;return;
case"quick":p.quick=2;return;
case"backfire":for(let i=0;i<2&&p.pos>0;i++){p.pos--;await hop(p)}return"moved";
case"drain":{const ks=p.hand.map((x,k)=>x?k:-1).filter(k=>k>=0);if(ks.length){const k=ks[Math.floor(Math.random()*ks.length)];disc.push(p.hand[k]);p.hand[k]=null;upd();renderHand()}return}
case"tax":{const ks=p.hand.map((x,k)=>x?k:-1).filter(k=>k>=0);if(!ks.length)return;
const list=ks.map(k=>({c:p.hand[k],label:"Slot "+(k+1)}));
const j=await cardPick(p,"Tax Collector","Choose a card to give to "+t.owner.em+" "+t.owner.ch+".",list),k=ks[j],card=p.hand[k];p.hand[k]=null;
const s=t.owner.hand.indexOf(null);if(s>=0)t.owner.hand[s]=card;else disc.push(card);upd();renderHand();return}
case"rewind":for(let i=0;i<3&&p.pos>0;i++){p.pos--;await hop(p)}return"moved";
case"start":await warp(p,0);return"moved";
case"spin":{const v=await rollDie();await announce("🎲","Spin Out!","You rolled a "+v+" and spin back "+v+" spaces.");for(let i=0;i<v&&p.pos>0;i++){p.pos--;await hop(p)}return"moved"}
case"mix":{const cand=P.filter(q=>q!==p&&!q.out&&typeof q.pos==="number").sort((a,b)=>a.pos-b.pos),last=cand[0];
if(last&&last.pos<p.pos){await announce("🔄","Mix-Up!","Swapping places with "+last.em+" "+last.ch+" in last place.",["Swap"]);const pa=p.pos,pb=last.pos;await Promise.all([warp(p,pb),warp(last,pa)]);return"moved"}
await announce("🔄","Mix-Up!","You’re already in last place, so nothing changes.");return}}}
async function pickup(p){if(!deck.length&&!disc.length)return;
const i=await pick("🃏","No fortune","Nothing happens here, but you may pick up a card. If your hand is full you will discard one.",["Take a card","Leave it"],[1,0],true);
if(i!==0)return;const c=await gainCard(p);upd();renderHand();if(!c)return;
await announce("🃏","Card picked up",p.ch+" picked up a card"+(!p.cpu&&!MULTI()?": <b>"+c.name+"</b> — "+c.desc:"")+".")}

/* ---------- Turn flow ---------- */
async function land(p,d){const n=p.pos;if(G.hl)G.hl(n);
if(MODE==="cards"&&TR[n]){if(p.ghost&&TR[n].card.id!=="backfire")await announce(n,"A trap… ignored","👻 Ghost Step lets you slip past it. The trap stays on the board.");else{const r=await fireTrap(p,n);if(r!=="blocked")return}}
const[t,x,a]=G.T[n];
if(!a)return announce(n,t,x);
if(MODE==="cards"&&p.shield&&isBad(a,n))return announce(n,t,x+"<br><em>✨ Your Shield blocks the bad fortune!</em>");
if((a.only&&!a.only.includes(p.ch))||(a.not&&a.not.includes(p.ch)))return announce(n,t,x+"<br><em>…but that doesn’t apply to the "+p.ch+".</em>");
if(a.secret&&!p.key)return announce(n,t,x+"<br><em>You don’t have the key. The door stays shut.</em>");
if(a.needRec&&p.rec!==a.needRec)return announce(n,t,x+"<br><em>You need a "+a.needRec+" record to enter. Nothing happens.</em>");
if(a.ahead){const ah=P.filter(q=>q!==p&&!q.out&&typeof q.pos==="number"&&q.pos>p.pos).sort((u,v)=>u.pos-v.pos)[0];
if(!ah)return announce(n,t,x+"<br><em>No one is ahead of you, so you stay put.</em>");
await announce(n,t,x+"<br><em>Switching with "+ah.em+" "+ah.ch+" on "+ah.pos+".</em>",["Switch places"]);
const pa=p.pos,pb=ah.pos;await Promise.all([warp(p,pb),warp(ah,pa)]);return}
if(a.tag){const o=P.filter(q=>q!==p&&!q.out&&q.pos!=="S");if(!o.length)return announce(n,t,x+"<br><em>No one to pick.</em>");
const q=o[await pick(n,t,x+"<br>Pick who joins you:",o.map(q=>q.em+" "+q.ch+(q.pos?" ("+q.pos+")":"")),o.map(q=>numPos(q)))];
await warp(q,p.pos);return}
if(a.skipo){const o=P.filter(q=>q!==p&&!q.out&&q.pos!=="S");if(!o.length)return announce(n,t,x+"<br><em>No one to pick.</em>");let q=o[0];
if(o.length>1)q=o[await pick(n,t,x+"<br>Pick who skips their next turn:",o.map(q=>q.em+" "+q.ch),o.map(q=>numPos(q)))];else await announce(n,t,x+"<br><em>"+q.em+" "+q.ch+" skips their next turn.</em>");
q.skip=(q.skip||0)+1;upd();return}
if(a.gamble){if(await pick(n,t,x,["Gamble 🎲","Walk away"],[.5*40+.5*(-G.end*.3),numPos(p)]))return;
const v=await rollDie();await announce("🎲","You rolled a "+v,v>3?"Jackpot! Off to space 40.":"The house wins. You lose the game.");
if(v>3){await warp(p,40);await land(p,d+1)}else out(p);return}
if(a.swap){const o=P.filter(q=>q!==p&&!q.out&&q.pos!=="S");if(!o.length)return announce(n,t,"No one to swap with!");
const q=o[await pick(n,t,"Choose who to swap with:",o.map(q=>q.em+" "+q.ch),o.map(q=>numPos(q)-numPos(p)))],pa=p.pos,pb=q.pos;
await Promise.all([warp(p,pb),warp(q,pa)]);return}
const lab=a.go?"Go to "+a.go:a.back?"Move back "+a.back:a.fwd?"Move forward "+a.fwd:a.key?"Take the key 🔑":a.again?"Roll again 🎲":a.secret?"Enter the secret room":a.win?"Claim victory 🏆":"Continue";
await announce(a.secret?"6":n,a.secret?"The secret room!":t,a.secret?"The key fits! You win the game!":x,[lab]);
if(a.key){p.key=true;upd()}
if(a.rec){p.rec=a.rec;upd()}
if(a.ball){p.bm=(p.bm||0)|(1<<a.ball);upd()}
if(a.go){await warp(p,a.go);if(a.skip){p.skip+=a.skip;await announce(a.go,"Jail","You’re locked up and will skip your next turn.")}else if(d<6&&!a.nc)await land(p,d+1)}
else if(a.back||a.fwd){for(let i=0;i<(a.back||a.fwd);i++){p.pos+=a.back?-1:1;await hop(p)}if(d<6)await land(p,d+1)}
else if(a.skip)p.skip+=a.skip;
else if(a.lose)out(p);
else if(a.again)p.extra=true;
else if(a.secret){await warp(p,"S");p.won=true}
else if(a.win)p.won=true}
async function endTurn(p){upd();p.shield=false;p.ghost=false;p.mod={};p.pre=false;
if(p.won)return finish(p);
if(P.every(q=>q.out))return finish(null);
const alive=P.filter(q=>!q.out);if(P.length>1&&alive.length===1){alive[0].last=true;return finish(alive[0])}
if(p.extra)p.extra=false;else do{cur=(cur+1)%P.length}while(P[cur].out);
return begin()}
async function begin(){const p=P[cur];upd();p.mod={};p.shield=false;p.ghost=false;p.acted=false;p.pre=false;REV=!MULTI();
if(p.skip>0){p.skip--;renderHand();await announce("⏭",p.ch+" skips a turn","Sitting this one out.");return endTurn(p)}
p.pre=true;renderHand();
if(p.cpu){$("#roll").disabled=true;await sleep(450);if(MODE==="cards")await cpuCards(p);return turn()}
$("#roll").disabled=false}
async function rollWithMods(p){const m=p.mod||{};let v;
if(m.steady){const i=await pick("👣","Steady Steps","Choose how far to move.",["1","2","3"],[1,2,3].map(k=>landScore(p,numPos(p)+k,false,numPos(p))));v=i+1}
else{v=await rollDie();
if(m.dice){const w=await rollDie();await announce("🎲","Double Dice","You rolled "+v+" and "+w+". Using the higher: "+Math.max(v,w)+".");v=Math.max(v,w)}
if(m.reroll){const i=await pick("🔁","You rolled a "+v,"Keep it, or reroll once?",["Keep "+v,"Reroll"],[landScore(p,numPos(p)+v,false,numPos(p)),evRoll(p)]);
if(i===1){const w=await rollDie();await announce("🔁","Rerolled: "+w,"The new roll stands.");v=w}}
if(m.bonus){await announce("⚡","Power Roll","You rolled "+v+", plus 2 makes "+(v+2)+".");v+=2}}
if(p.heavy){const w=Math.max(1,Math.floor(v/2));await announce("🦶","Heavy Feet","Your roll of "+v+" counts as "+w+".");v=w;p.heavy=false}
if(p.quick>0){p.quick--;if(v>3){await announce("⏳","Quicksand","Your roll of "+v+" counts as 3.");v=3}}
return v}
async function turn(){const p=P[cur];$("#roll").disabled=true;p.pre=false;renderHand();
const v=await rollWithMods(p);log(`${p.em} ${p.ch} rolled ${v}`);
if(p.cpu&&!Object.keys(p.mod||{}).length)await announce("🎲",p.ch+" rolled a "+v,"CPU "+(dif(p)==="hard"?"Hard":"Easy"),["OK"]);
const m=p.mod||{};let jump=null,dir=1;
if(m.magnet){const tg=P.filter(q=>q!==p&&!q.out&&typeof q.pos==="number"&&q.pos-p.pos>=1&&q.pos-p.pos<=6);
if(tg.length){const i=await pick("🧲","Magnet","You rolled "+v+". Move normally, or jump onto a player ahead? Nothing triggers if you jump.",["Move "+v,...tg.map(q=>"Jump to "+q.em+" "+q.ch+" (tile "+q.pos+")")],[p.pos+v>G.end?p.pos:landScore(p,p.pos+v,false,p.pos),...tg.map(q=>q.pos)]);if(i>0)jump=tg[i-1].pos}}
if(jump==null&&m.detour&&p.pos>0){const i=await pick("↩️","Detour Ticket","You rolled "+v+". Move forward or back?",["Forward "+v,"Back "+v],[p.pos+v>G.end?p.pos:landScore(p,p.pos+v,false,p.pos),landScore(p,Math.max(0,p.pos-v),false,p.pos)]);if(i===1)dir=-1}
if(jump!=null){log(`${p.em} ${p.ch} jumped to ${jump}`);await warp(p,jump);return endTurn(p)}
if(dir===1&&p.pos+v>G.end){await announce("🚫","Too far!","You rolled "+v+", but you only need "+(G.end-p.pos)+" or less to finish. You stay put and your turn passes.",["OK"]);return endTurn(p)}
for(let i=0;i<v&&(dir>0||p.pos>0);i++){p.pos+=dir;await hop(p)}
if(p.pos===0)return endTurn(p);
const f={quiet:!G.T[p.pos][2]&&!TR[p.pos]};
await land(p,0);
if(MODE==="cards"&&f.quiet&&!p.out&&!p.won&&!p.ghost)await pickup(p);
await endTurn(p)}
async function finish(p){if(window.__onfinish){window.__onfinish(p);return}
const r=await announce("🏆",p?p.ch+" wins!":"Game over",p?(p.last?"Everyone else was eliminated. Last one standing!":p.pos==="S"?"They unlocked the secret ANT.INC room!":G.winText):"Everyone lost.",["Play again","Choose a game"]);if(r)page("games");else setup()}
async function decideOrder(){const ranked=[];
async function rank(g,tie){if(g.length===1){ranked.push(g[0]);return}
const r=new Map();
for(const p of g){cur=P.indexOf(p);upd();
if(!p.cpu)await announce("🎲",p.ch+", roll for turn order",tie?"Tie! Roll again.":"The highest roll goes first.",["Roll"]);
const v=await rollDie();r.set(p,v);
await announce("🎲",p.ch+(p.cpu?" (CPU)":"")+" rolled a "+v,"Nice roll.",["OK"])}
const vals=[...new Set(r.values())].sort((a,b)=>b-a);
for(const v of vals)await rank(g.filter(p=>r.get(p)===v),true)}
await rank([...P],false);
P=ranked;cur=0;upd();
await announce("📋","Turn order",P.map((p,i)=>(i+1)+". "+p.em+" "+p.ch+(p.cpu?" (CPU)":"")).join("<br>"),["Start playing"])}
function startGame(id){G=GAMES[id];MODE=PLAYSET.mode;PT=PLAYSET.pt;DIFF=PLAYSET.diff||"easy";$("#sub").textContent=G.sub+(MODE==="cards"?" · Wild Cards":"");board.style.setProperty("--asp",G.asp);board.style.setProperty("--ov",G.ov+"px");G.build();fitTs();P=[];$("#players").innerHTML="";$("#log").innerHTML="";$("#hand").hidden=true;setup()}

return{ch,em,color:c,cpu,pos:0,key:false,skip:0,out:false,won:false,extra:false,last:false,rec:"",hand:[null,null,null],mod:{},el}}

P=[...list].sort((a,b)=>a[0]-b[0]).map(([i,c])=>newPlayer(i,c));

place();upd();REV=!MULTI();renderHand();return decideOrder().then(begin)}

const RULES=[
["The goal","Be the first to reach the Evil Fish, whether that is the last space or anywhere else he is lurking, and get there in one piece."],

["Players","Two to six players can play. Each player picks a different character."],
["Fortunes","Watch for secret passageways, shortcuts and nasty obstacles. Some fortunes change where you stand, and others decide whether you get to roll at all. Some only affect certain characters, some let you swap places with another player, and some let you pick up items. A few spaces knock you out of the game, so tread carefully."],
